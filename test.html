<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Vocacional - Orienta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="navbar">
        <div class="nav-container">
            <h1 class="logo">
                <a href="index.html" class="logo-link" style="display: flex; align-items: center; text-decoration: none; color: inherit;">
                    <svg width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle; margin-right: 8px;">
                        <defs>
                            <linearGradient id="orientaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#4F46E5" />
                                <stop offset="100%" stop-color="#7C3AED" />
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="45" fill="url(#orientaGrad)" />
                        <path d="M50 18 L57 43 L82 50 L57 57 L50 82 L43 57 L18 50 L43 43 Z" fill="#FFFFFF" />
                        <circle cx="50" cy="50" r="5" fill="#4F46E5" />
                    </svg>
                    <span>Orienta</span>
                </a>
            </h1>
            <button id="hamburger-btn" class="hamburger" aria-label="Abrir menú">☰</button>
        </div>
    </header>

    <!-- MENÚ LATERAL (DRAWER) -->
    <aside id="nav-drawer" class="drawer">
        <button id="drawer-close-btn" class="close-btn" aria-label="Cerrar menú">&times;</button>
        <ul class="drawer-menu">
    <li><a href="index.html">Inicio</a></li>
    <li><a href="carreras.html">Carreras</a></li>
    <li><button id="reset-data-btn" class="btn-link">Reiniciar Test</button></li>
</ul>
    </aside>
    <div id="menu-overlay" class="overlay"></div>

    <!-- CONTENIDO PRINCIPAL DEL CUESTIONARIO -->
    <main class="container">
        
        <!-- BARRA DE PROGRESO -->
        <div class="progress-container">
            <div id="test-progress-bar" class="progress-bar"></div>
        </div>

        <!-- ENCABEZADO DE NAVEGACIÓN DEL TEST -->
        <div class="test-header">
            <button id="prev-btn-top" class="btn-secondary">← Anterior</button>
            <span id="page-indicator" class="page-indicator">Paso 1 de 6</span>
        </div>

        <!-- CONTENEDOR DE LAS PREGUNTAS (CARGADAS VÍA JAVASCRIPT) -->
        <div id="quiz-box" class="quiz-container">
            <!-- JavaScript inyectará las 6 preguntas correspondientes a cada sección -->
        </div>

        <!-- BOTÓN DE NAVEGACIÓN INFERIOR -->
        <div class="test-footer">
            <button id="next-btn" class="btn-primary btn-block">Siguiente →</button>
        </div>

    </main>

    <!-- VÍNCULO A JAVASCRIPT -->
    <script src="script.js"></script>
</body>
</html>
